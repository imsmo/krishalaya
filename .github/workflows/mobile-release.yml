# .github/workflows/mobile-release.yml · Mobile release pipeline (MOBILE_AI_AGENT_BUILD_GUIDE §8). Manual dispatch
# picks a track: an EAS BINARY build (beta/production) or an OTA UPDATE (expo-updates, JS-only). Binary builds
# upload source maps PRIVATELY to the crash service then strip them; production submits start a 1% staged rollout.
# OTA publishes to a channel and can be rolled back. All secrets live in GitHub/EAS secrets — never in the repo.
#
# PC-56 REL-1: this file could never run. (1) Not valid YAML: `${{ … }}` inside `{ … }` flow mappings breaks the parser
# (same fault mobile-ci.yml had) → block style. (2) `npm ci` / `npm run -w` / `npm audit` in a pnpm workspace → pnpm, as
# mobile-ci.yml does (ui-native built first; mobile resolves it through its gitignored dist/). (3) Every `eas` step ran
# from the repo root, but app.config.ts and eas.json live in apps/mobile → those steps now run there. The release
# gates now also run lint, matching mobile-ci. What each track does (build/submit/update/rollback, flags, secrets,
# the production environment gate) is unchanged.
# PC-56 MOB-STORE-1: expo-updates is now installed (the OTA track works), the source-map upload is real (EAS builder for
# binaries, this runner for OTA bundles) and skipped with a warning when the Sentry token is absent.
name: mobile-release

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'binary-build | ota-update | ota-rollback'
        required: true
        default: 'ota-update'
      profile:
        description: 'eas profile / channel: beta | production'
        required: true
        default: 'beta'

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ github.event.inputs.profile }}   # required reviewers gate production
    # MOB-STORE-1: app.config.ts reads these when `eas` evaluates it on this runner. EAS_PROJECT_ID (not a secret: the `eas init`
    # id) builds updates.url + extra.eas.projectId; the SENTRY_* values gate the OTA source-map upload below. The BINARY build's
    # upload runs on the EAS builder, from the same names set as EAS environment variables (docs/mobile/PUSH-SETUP.md).
    env:
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4            # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'                  # MOB-SDK-1: Expo SDK 58 / React Native 0.88 require Node ≥ 22.13
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build mobile's workspace packages (each resolves through its gitignored dist/)
        run: pnpm --filter "@krishalaya/mobile^..." build
      - name: Re-run CI gates before release (defence-in-depth)
        run: >-
          pnpm --filter @krishalaya/mobile typecheck &&
          pnpm --filter @krishalaya/mobile lint &&
          pnpm --filter @krishalaya/mobile test -- --ci &&
          pnpm audit --prod --audit-level high
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS binary build
        if: ${{ github.event.inputs.action == 'binary-build' }}
        working-directory: apps/mobile
        run: eas build --platform all --profile ${{ github.event.inputs.profile }} --non-interactive
      # MOB-STORE-1: a binary build's source maps are uploaded BY THE EAS BUILDER (the @sentry/react-native plugin's gradle /
      # Xcode step, enabled when SENTRY_AUTH_TOKEN is an EAS secret) and never packed into the AAB/IPA. There is no local
      # `dist` here, so the old `sentry-expo-upload-sourcemaps dist` after `eas build` could never upload anything.
      - name: Crash reporting configured? (binary builds)
        if: ${{ github.event.inputs.action == 'binary-build' && env.SENTRY_AUTH_TOKEN == '' }}
        run: echo "::warning::SENTRY_AUTH_TOKEN is not set - release crashes will not be symbolicated (docs/mobile/PUSH-SETUP.md, Sentry section)."
      - name: Submit (production starts at 1% staged rollout)
        if: ${{ github.event.inputs.action == 'binary-build' }}
        working-directory: apps/mobile
        run: eas submit --platform all --profile ${{ github.event.inputs.profile }} --non-interactive

      - name: OTA update (JS-only) to channel
        if: ${{ github.event.inputs.action == 'ota-update' }}
        working-directory: apps/mobile
        run: eas update --channel ${{ github.event.inputs.profile }} --environment production --message "${{ github.sha }}" --non-interactive   # --environment is required since SDK 55; both beta and production build with EXPO_PUBLIC_APP_ENV=production (eas.json)
      # The OTA bundle `eas update` just exported to apps/mobile/dist: upload its maps PRIVATELY (Debug IDs from the Sentry
      # Metro config match them to crashes), then delete them so nothing else can pick them up. Skipped without the token.
      - name: Upload OTA source maps (private) to Sentry
        if: ${{ github.event.inputs.action == 'ota-update' && env.SENTRY_AUTH_TOKEN != '' }}
        working-directory: apps/mobile
        run: npx sentry-expo-upload-sourcemaps dist && find dist -name '*.map' -delete
      - name: OTA source-map upload skipped
        if: ${{ github.event.inputs.action == 'ota-update' && env.SENTRY_AUTH_TOKEN == '' }}
        run: echo "::warning::SENTRY_AUTH_TOKEN is not set - OTA source maps not uploaded."
      - name: OTA rollback (revert to previous publish)
        if: ${{ github.event.inputs.action == 'ota-rollback' }}
        working-directory: apps/mobile
        run: eas update:rollback --channel ${{ github.event.inputs.profile }} --non-interactive
