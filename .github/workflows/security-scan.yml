# .github/workflows/security-scan.yml · secret scanning + dependency audit. Fails the build on a committed
# secret or a high/critical advisory. Runs on every PR/push + weekly.
name: security-scan
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so gitleaks scans all commits
      - name: gitleaks (committed-secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
      - name: grep guard — no tracked .env (only .env.example allowed)
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$' || true)
          if [ -n "$bad" ]; then echo "FATAL: tracked .env files:"; echo "$bad"; exit 1; fi
          echo "OK: no tracked .env files."
      # PC-56 SEC-7: every backend refuses, in production, any secret ever committed to this PUBLIC repository. That
      # only works if each service's fingerprint list covers the whole history — fail when a commit added a
      # secret-like value without regenerating (node scripts/security/known-public-secrets.mjs).
      - name: published-secret fingerprints cover the whole history
        run: node scripts/security/known-public-secrets.mjs --check

  dep-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # PC-56 CI-3: no `version:` here — package.json "packageManager" pins pnpm@9.15.9, and naming both made
      # pnpm/action-setup stop with "Multiple versions of pnpm specified", so this audit never ran. Frozen install:
      # CI must fail on lockfile drift, not silently rewrite the lockfile it is about to audit.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }   # MOB-SDK-1: the workspace now holds Expo SDK 58 (Node ≥ 22.13, engine-strict)
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (fail on high/critical)
        run: pnpm audit --audit-level high || (echo "High/critical advisories found — triage before release." && exit 1)
