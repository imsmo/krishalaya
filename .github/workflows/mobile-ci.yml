# .github/workflows/mobile-ci.yml · Mobile CI gates (MOBILE_AI_AGENT_BUILD_GUIDE §8/§9). MUST be green to merge:
# typecheck, lint, unit tests, dependency audit, bundle-size budget, and the Maestro e2e on the critical
# sell+buy+pay path. No secrets needed for the gate job (build/submit live in mobile-release.yml).
name: mobile-ci

on:
  pull_request:
    paths: ['apps/mobile/**', 'packages/**', '.github/workflows/mobile-ci.yml']
  push:
    branches: [main]
    paths: ['apps/mobile/**', 'packages/**']

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # PC-56 BUNDLE-1a follow-up: this is a pnpm workspace (package.json "packageManager"); `npm ci` failed before any gate ran.
      - uses: pnpm/action-setup@v4            # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: pnpm }
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build ui-native (mobile resolves it through its gitignored dist/)
        run: pnpm --filter @krishalaya/ui-native build
      - name: Typecheck (mobile + sdk + ui-native)
        run: pnpm --filter @krishalaya/mobile typecheck && pnpm --filter @krishalaya/sdk-js typecheck && pnpm --filter @krishalaya/ui-native typecheck
      - name: Lint
        run: pnpm --filter @krishalaya/mobile lint
      - name: Unit tests (pure core + sdk)
        run: pnpm --filter @krishalaya/mobile test -- --ci && pnpm --filter @krishalaya/sdk-js test -- --ci
      - name: Dependency audit (production deps, fail on high+)
        run: pnpm audit --prod --audit-level high
      - name: Hermes bytecode as shipped ≤ 6,000 KB
        run: node apps/mobile/scripts/check-bundle-size.mjs

  e2e:
    # Critical-path e2e on the sell+buy+pay flow (Maestro). Runs on an Android emulator in CI.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: gates
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @krishalaya/ui-native build
      - name: Build a dev-client APK for e2e (EAS local)
        run: npx eas-cli build --platform android --profile development --local --output ./app-e2e.apk
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.E2E_API_URL }}
      - name: Run Maestro flows (sell + buy + pay)
        uses: mobile-dev-inc/action-maestro-cloud@v1
        with:
          api-key: ${{ secrets.MAESTRO_API_KEY }}
          app-file: ./app-e2e.apk
          workspace: apps/mobile/.maestro
