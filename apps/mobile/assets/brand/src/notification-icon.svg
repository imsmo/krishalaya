<!-- Krishalaya mark (Direction A, BRAND-029/030 — the same glyph as apps/web-storefront/public/favicon.svg: brand green
     #1e6f3f -> #134628 tile, harvest-gold #f9c45a sprout/ear). SOURCE for the PNG generated by
     apps/mobile/scripts/generate-brand-assets.mjs — edit this file, then re-run the script. -->
<!-- Android status-bar notification icon, 96x96: a WHITE silhouette on transparent (Android ignores colour and draws
     only the alpha channel; the tint is expo-notifications' `color`). Uses the OFFICIAL <24px cut (5 paths, stroke 5.0)
     because this renders at 24 dp, where the 7-path glyph's arms merge (BRAND-029 Exhibit B). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <g transform="translate(48 48) scale(1.55) translate(-24 -24)" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 0v48"/>
    <path d="M14 7c0 6 4.5 9 10 9"/>
    <path d="M34 7c0 6-4.5 9-10 9"/>
    <path d="M14 19c0 6 4.5 9 10 9"/>
    <path d="M34 19c0 6-4.5 9-10 9"/>
  </g>
</svg>
