# infra/k8s/observability/servicemonitor.yaml · scrape every krishalaya service's /metrics endpoint.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: krishalaya-services
  namespace: monitoring
  labels: { release: kube-prometheus-stack }
spec:
  namespaceSelector: { matchNames: [krishalaya] }
  selector:
    matchLabels: { app.kubernetes.io/part-of: krishalaya }   # set by the Helm library chart labels
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
