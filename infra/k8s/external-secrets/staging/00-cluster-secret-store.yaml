# infra/k8s/external-secrets/staging/00-cluster-secret-store.yaml
# STAGING variant of infra/k8s/external-secrets/00-cluster-secret-store.yaml (prod, untouched by this batch).
# Byte-identical content to the prod file — this manifest carries no environment-specific string (no
# "krishalaya-prod"/"krishalaya-staging" literal inside it); it only names the ESO controller's own
# service account and AWS region. It is duplicated here (rather than left as "just reuse the prod file")
# because staging is its OWN EKS cluster (S1_STAGING_APPLY_RUNBOOK.md §0) with its OWN External Secrets
# Operator install and its OWN `external_secrets_role_arn` Terraform output — kubectl context determines
# which cluster this lands in, not the file content. [DEV-29, 2026-07-28 — templated, not applied: no
# cluster/cloud access in this sandbox, see Development_Program/spec_dev29.md]
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets         # the ESO controller SA (annotated with the STAGING IRSA role that can read krishalaya-staging/*)
            namespace: external-secrets
