# infra/k8s/external-secrets/wallet-service.yaml · sync AWS Secrets Manager -> k8s Secret krishalaya-wallet-env (consumed by the wallet-service chart)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: wallet-service-env
  namespace: krishalaya
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: krishalaya-wallet-env
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: krishalaya-prod/wallet/env   # a JSON secret in Secrets Manager holding every env var for this service
